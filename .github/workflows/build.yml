name: Build Forge 1.20.1 Mod

on:
  push:
分支: [main, master, develop]
  pull_request:
分支: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 如果需要完整 Git 历史（可选）

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod with Gradle
        run: ./gradlew jar --no-daemon  # 改为 jar，跳过 makeChangelog

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1-mod
          path: build/libs/*[0-9].jar  # 只上传主 JAR，排除 sources
